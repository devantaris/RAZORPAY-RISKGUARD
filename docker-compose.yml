version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: riskguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: riskguard_secret
      POSTGRES_DB:       riskguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: riskguard_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riskguard_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Mount models from research repo (read-only)
      - C:/Users/Devansh/Desktop/Projects/Knowing-When-Not-to-Decide/models:/app/research_models:ro
      - ./backend/artifacts:/app/artifacts
    environment:
      PYTHONPATH: /app

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riskguard_celery
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/artifacts:/app/artifacts
    environment:
      PYTHONPATH: /app

volumes:
  pgdata:
